# Demo Agent environment matrix: Windows 11, fresh install of 2.4.0.
# A clean clone installs the candidate, registers once, then checks status and the first inventory.
schemaVersion: 1
id: demo.agent-matrix.windows-fresh
name: Demo Agent 2.4 fresh install on Windows 11
os:
  family: windows
  version: "11"
provider:
  type: proxmox
  template: windows11-template-qga-9200
  templateVmId: 9200
  vmIdRange:
    start: 9102
    end: 9199
  clone:
    network: disconnected
isolation:
  mode: ephemeralClone
guest:
  mode: qemuAgent
  screen:
    signIn: true
    showCommands: true
artifact:
  type: folder
  pathParam: artifactPath
  destination: "C:\\Oslab\\artifact"
  transfer: archive
  exclude:
    - "*.py"
product:
  steps:
    - id: version
      command:
        shell: powershell
        template: '& "{ArtifactDir}\demo-agent.ps1" version -Json'
      captureStdoutJson: true
      expectStdoutJson:
        version: "2.4.0"
        installed.present: false
        registered: false
    - id: install
      command:
        shell: powershell
        template: '& "{ArtifactDir}\demo-agent.ps1" install -Json'
      captureStdoutJson: true
      expectStdoutJson:
        mode: fresh
        version: "2.4.0"
        migration.status: not-needed
    - id: register
      command:
        shell: powershell
        template: '& "C:\Program Files\DemoAgent\demo-agent.ps1" register -ServerUrl "https://inventory.example.invalid" -AssetName "demo-win11-fresh" -Json'
      captureStdoutJson: true
      expectStdoutJson:
        registered: true
        alreadyRegistered: false
        registration.assetName: demo-win11-fresh
    - id: status
      command:
        shell: powershell
        template: '& "C:\Program Files\DemoAgent\demo-agent.ps1" status -Json'
      captureStdoutJson: true
      expectStdoutJson:
        installed.version: "2.4.0"
        registration.assetName: demo-win11-fresh
        registration.origin: registered
        config.serverUrl: https://inventory.example.invalid
        state.schemaVersion: 2
        migration.status: not-needed
    - id: scan
      command:
        shell: powershell
        template: '& "C:\Program Files\DemoAgent\demo-agent.ps1" scan -Output "{OutputPath}" -Json'
      captureStdoutJson: true
      expectStdoutJson:
        outputWritten: true
        asset.name: demo-win11-fresh
outputs:
  actual:
    path: "C:\\Oslab\\demo-agent-inventory.json"
    adapter: canonical.inventory
assertions:
  - type: inventory.contains
    id: agent-reports-candidate-version
    match:
      name: Demo Agent
      version: "2.4.0"
    requiredSources:
      - DemoAgent
  - type: inventory.evidencePresent
    id: agent-state-evidence
    match:
      name: Demo Agent
    evidence:
      type: state
      source: DemoAgent
  - type: inventory.sourcePresent
    id: installed-programs-scanned
    source: Registry
  - type: inventory.contains
    id: guest-agent-found
    match:
      nameContains: QEMU guest agent
      source: Registry
reports:
  formats:
    - junit
    - json
    - html
cleanup:
  destroyVm: true
  keepVmOnFailure: false
