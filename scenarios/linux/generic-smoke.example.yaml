schemaVersion: 1
id: generic.linux.smoke
name: Generic Linux system information demo
os:
  family: linux
  version: "24.04"
provider:
  type: proxmox
  template: ubuntu-24.04-template
  templateVmId: 9000
  vmIdRange:
    start: 9185
    end: 9189
  clone:
    display: virtio
    network: disconnected
isolation:
  mode: ephemeralClone
guest:
  mode: qemuAgent
  screen:
    showCommands: true
fixtures:
  - id: baseline
    type: shell
    source: validation/fixtures/linux/generic-smoke.sh
artifact:
  type: folder
  pathParam: artifactPath
  destination: /opt/oslab/artifact
  transfer: archive
  command:
    shell: sh
    template: '"{ArtifactDir}/run-system-demo.sh" "{OutputPath}"'
outputs:
  actual:
    path: /opt/oslab/command-result.json
    adapter: canonical.command
assertions:
  - type: command.exitCode
    id: linux-system-exit-zero
    exitCode: 0
  - type: command.stdoutContains
    id: linux-system-marker
    text: oslab linux system demo
  - type: file.exists
    id: os-release-exists
    path: /etc/os-release
  - type: file.exists
    id: fixture-snapshot-exists
    path: /tmp/oslab/os-release.snapshot
reports:
  formats:
    - junit
    - json
    - html
cleanup:
  destroyVm: true
  keepVmOnFailure: false
