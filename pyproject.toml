[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oslab"
version = "0.1.0"
description = "Provider-driven OS integration test platform for disposable VMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
computer-use = [
  "anyio>=4.6",
  "cryptography>=44",
  "mcp>=1.26,<2",
  "Pillow>=11",
  "websockets>=15,<17",
]

[project.scripts]
oslab = "oslab.cli:main"
oslab-mcp = "oslab.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The desktop console helper that OSLab compiles inside Windows guests.
"oslab.runners" = ["*.cs"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

